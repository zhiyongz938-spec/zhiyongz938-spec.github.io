<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>AI 诊断页</title></head>
<body style="font-family:sans-serif;padding:20px">
<h2>🔍 AI 深度解读诊断页</h2>
<p>点击按钮测试浏览器直连 DeepSeek：</p>
<button onclick="testAI()" style="padding:12px 30px;font-size:16px">测试 AI 连接</button>
<div id="result" style="margin-top:16px;background:#f5f5f5;padding:14px;border-radius:8px;white-space:pre-wrap;word-break:break-all"></div>
<script>
const KEY = "sk-5b471cd9a84d4671b3eb4534097c50ce";
async function testAI(){
  const out = document.getElementById('result');
  out.textContent = '请求中...（最多等15秒）';
  const t0 = Date.now();
  try{
    const r = await fetch('https://api.deepseek.com/chat/completions',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+KEY},
      body: JSON.stringify({model:'deepseek-v4-flash',messages:[{role:'user',content:'你好'}],max_tokens:50,thinking:{type:'disabled'}}),
      signal: AbortSignal.timeout(15000)
    });
    const j = await r.json();
    const ms = Date.now()-t0;
    if(r.ok){
      out.textContent = '✅ 成功! 耗时 '+ms+'ms\n回复: '+(j.choices?.[0]?.message?.content||'');
    }else{
      out.textContent = '❌ HTTP '+r.status+' (耗时 '+ms+'ms)\n'+(j.error?.message||JSON.stringify(j));
    }
  }catch(e){
    out.textContent = '❌ 异常 (耗时 '+(Date.now()-t0)+'ms)\n错误: '+e.message+'\n名称: '+(e.name||'');
  }
}
</script>
</body>
</html>
